<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento - RED NEC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --nec-dark: #12222b;
      --nec-accent: #17a2b8;
      --nec-accent-soft: #e6f6f8;
    }
    body { background:#f7fafb; font-family:"Segoe UI",sans-serif; }

    /* NAVBAR UNIFICADO */
    .navbar {
      background: linear-gradient(90deg, #17a2b8 0%, #138496 100%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
    .nav-link { color:#e6f6f8 !important; transition: color 0.2s ease; }
    .nav-link:hover, .nav-link.active { color:#fff !important; text-decoration: underline; }

    .seg-hero {
      background: linear-gradient(135deg, var(--nec-dark) 0%, #1c3b47 100%);
      color:#fff; text-align:center; padding:4rem 0;
      border-radius:0 0 1.5rem 1.5rem;
    }

    .stat-card { border:none; border-radius:1rem; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.08); }
    .stat-number { font-size:2rem; font-weight:700; color:var(--nec-accent); }

    .alumno-card { border:none; border-radius:1rem; box-shadow:0 2px 10px rgba(0,0,0,.07); cursor:pointer; transition:all .2s ease; }
    .alumno-card:hover { box-shadow:0 8px 22px rgba(0,0,0,.12); transform:translateY(-3px); }
    .avatar-inicial {
      width:48px; height:48px; border-radius:50%; background:var(--nec-accent-soft);
      color:var(--nec-accent); font-weight:700; display:flex; align-items:center; justify-content:center;
    }

    #panel-alumno { max-height:0; overflow:hidden; transition:max-height .4s ease; }
    #panel-alumno.abierto { max-height:2200px; margin-top:2rem; }

    footer { background-color: var(--nec-dark); color:#e6f6f8; font-size:.9rem; }
  </style>
</head>
<body>
  <!-- NAVBAR UNIFICADO -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-info bg-opacity-90 shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="./index.html">RED NEC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link fw-semibold" href="./index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="./informacion.html">Información</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold active" href="./seguimiento.html">Seguimiento</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="./contacto.html">Contacto</a></li>
        </ul>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-light fw-semibold" data-bs-toggle="modal" data-bs-target="#modal-login">
            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
          </button>
          <button class="btn btn-light text-info fw-semibold" data-bs-toggle="modal" data-bs-target="#modal-register">
            <i class="bi bi-person-plus me-1"></i> Registrarse
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="seg-hero">
    <div class="container">
      <h2 class="fw-bold mb-2">Seguimiento de alumnos</h2>
      <p class="mb-0 opacity-75">Un solo lugar para registrar avances y observaciones.</p>
    </div>
  </section>

  <!-- MAIN -->
  <main class="container pb-5">
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card p-3 text-center"><div class="stat-number" id="stat-total">0</div><div class="text-muted small">Alumnos activos</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card p-3 text-center"><div class="stat-number" id="stat-notas">0</div><div class="text-muted small">Observaciones (mes)</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card p-3 text-center"><div class="stat-number" style="color:#2fb380" id="stat-buen">0</div><div class="text-muted small">Progreso sostenido</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card p-3 text-center"><div class="stat-number" style="color:#f0ad4e" id="stat-atencion">0</div><div class="text-muted small">Requieren atención</div></div></div>
    </div>

    <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between mb-3">
      <input type="search" id="buscador" class="form-control" style="max-width:320px" placeholder="Buscar alumno..."/>
    </div>

    <div class="row g-3" id="lista-alumnos"></div>
    <div id="panel-alumno" class="mt-4"></div>
  </main>

  <!-- FOOTER -->
  <footer class="py-3 text-center border-top">
    <small>© 2026 RED NEC – Formosa</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
