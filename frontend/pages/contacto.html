<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - RED NEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/contacto.css" />
</head>

<body>
     <body>
    <script src="../js/api.js"></script>
    <!-- HEADER -->
    <header class="hero-header text-white border-bottom">
      <div class="container d-flex flex-column align-items-center py-3">
        <div class="d-flex align-items-center mb-2">
          <img
            src="../assets/img/logo.png"
            alt="Logo RED NEC"
            class="img-fluid me-3 logo"
          />
          <h1 class="fw-bold m-0 rednec-title">RED NEC</h1>
        </div>
        <p class="fs-6 mb-0 text-light">Nexo Educativo Colaborativo</p>
      </div>
    </header>

    <!-- NAVBAR -->
    <nav
      class="navbar navbar-expand-lg navbar-dark navbar-custom border-top border-bottom"
    >
      <div class="container">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link fw-semibold" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-semibold" href="informacion.html"
                >Información</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-semibold" href="seguimiento.html"
                >Seguimiento</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-semibold" href="contacto.html">Contacto</a>
            </li>
          </ul>

          <div class="d-flex gap-2">
            <button
              class="btn btn-outline-light fw-semibold"
              data-bs-toggle="modal"
              data-bs-target="#modal-login"
            >
              Iniciar Sesión
            </button>
            <button
              class="btn btn-info text-white fw-semibold"
              data-bs-toggle="modal"
              data-bs-target="#modal-register"
            >
              Registrarse
            </button>
          </div>
        </div>
      </div>
    </nav>


    <!-- MAIN -->
    <main class="py-5 bg-light">
        <div class="container">
            <h2 class="fw-bold text-info mb-4">Formulario de Contacto</h2>
            <form class="contact-form">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre completo">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="tuemail@ejemplo.com">
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea>
                </div>
                <button type="submit" class="btn btn-info">Enviar</button>
            </form>

            <div class="alert alert-secondary mt-4">
                Próximamente se integrará un sistema de mensajería interna y seguimiento de consultas.
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-3 bg-dark text-center text-light border-top">
        <small>© 2026 RED NEC – Formosa</small>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
