<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso & Registro | RED NEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #090e17 0%, #0f172a 50%, #0c4a6e 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 960px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            display: grid;
            grid-template-columns: 1fr 1.15fr;
        }

        .auth-presentation {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 60%, #0369a1 100%);
            color: white;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .auth-forms {
            padding: 45px 40px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tabs-auth {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .tab-btn-auth {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            padding: 8px 18px;
            border-radius: 10px;
            transition: all 0.25s ease;
        }

        .tab-btn-auth.activo {
            color: #0284c7;
            background: #e0f2fe;
        }

        .form-seccion {
            display: none;
        }

        .form-seccion.activo {
            display: block;
        }

        .grupo-input {
            position: relative;
            margin-bottom: 14px;
        }

        .grupo-input span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            z-index: 2;
        }

        .input-auth {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            background: #f8fafc;
            color: #1e293b;
        }

        .input-auth:focus {
            border-color: #0284c7;
            background: white;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        #mensaje {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .msg-exito {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block !important;
        }

        .msg-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block !important;
        }

        #perfil {
            display: none;
            background: #f0fdf4;
            border: 1.5px solid #bbf7d0;
            border-radius: 16px;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .auth-container {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
            .auth-presentation {
                padding: 30px 20px;
            }
            .auth-forms {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <!-- PANEL IZQUIERDO DE PRESENTACIÓN -->
        <div class="auth-presentation">
            <div>
                <div class="d-inline-flex align-items-center justify-content-center bg-info bg-opacity-25 p-3 rounded-4 mb-3 text-info fs-1">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1 class="fw-bold mb-2 text-white">RED NEC</h1>
                <p class="text-light opacity-90 small">
                    Plataforma Integral de Coordinación Docente-Terapeuta-Familia en Nivel Inicial.
                </p>
                <div class="mt-4 pt-3 border-top border-light border-opacity-10 d-flex flex-column gap-2 text-light small opacity-80">
                    <div><i class="bi bi-check2-circle text-info me-2"></i> Gestión de alumnos y actividades</div>
                    <div><i class="bi bi-check2-circle text-info me-2"></i> Reportes fotográficos y analíticas</div>
                    <div><i class="bi bi-check2-circle text-info me-2"></i> Comunicación y articulación directa</div>
                </div>
            </div>
            <div class="mt-4">
                <a href="../pages/index.html" class="text-info text-decoration-none fw-semibold small d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Volver al Portal Principal
                </a>
            </div>
        </div>

        <!-- PANEL DERECHO DE FORMULARIOS -->
        <div class="auth-forms">

            <!-- Pestañas -->
            <div class="tabs-auth" id="tabsContenedor">
                <button type="button" class="tab-btn-auth activo" id="tabLoginBtn" onclick="cambiarTab('login')">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
                <button type="button" class="tab-btn-auth" id="tabRegistroBtn" onclick="cambiarTab('registro')">
                    <i class="bi bi-person-plus me-1"></i> Crear Cuenta
                </button>
            </div>

            <!-- FORMULARIO LOGIN -->
            <div class="form-seccion activo" id="seccionLogin">
                <form id="loginForm">
                    <div class="grupo-input">
                        <span><i class="bi bi-envelope"></i></span>
                        <input type="email" id="emailLogin" class="input-auth" placeholder="Correo electrónico" required autocomplete="email">
                    </div>
                    <div class="grupo-input">
                        <span><i class="bi bi-lock"></i></span>
                        <input type="password" id="passwordLogin" class="input-auth" placeholder="Contraseña" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-gradient-primary w-100 py-3 mt-2 shadow" id="btnLogin">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
                    </button>
                </form>
            </div>

            <!-- FORMULARIO REGISTRO -->
            <div class="form-seccion" id="seccionRegistro">
                <form id="registroForm">
                    <div class="grupo-input">
                        <span><i class="bi bi-person"></i></span>
                        <input type="text" id="nombre" class="input-auth" placeholder="Nombre completo" required>
                    </div>
                    <div class="grupo-input">
                        <span><i class="bi bi-envelope"></i></span>
                        <input type="email" id="emailRegistro" class="input-auth" placeholder="Correo electrónico" required autocomplete="email">
                    </div>
                    <div class="grupo-input">
                        <span><i class="bi bi-lock"></i></span>
                        <input type="password" id="passwordRegistro" class="input-auth" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="grupo-input">
                        <span><i class="bi bi-person-badge"></i></span>
                        <select id="rolRegistro" class="input-auth" onchange="alternarMatricula(this.value)" required>
                            <option value="docente">Docente de Nivel Inicial</option>
                            <option value="terapeuta">Terapeuta / Profesional</option>
                            <option value="familiar" selected>Familiar / Tutor</option>
                        </select>
                    </div>
                    <div class="grupo-input" id="grupoMatricula" style="display: none;">
                        <span><i class="bi bi-card-checklist"></i></span>
                        <input type="text" id="matriculaRegistro" class="input-auth" placeholder="N° de Matrícula Profesional">
                    </div>
                    <button type="submit" class="btn btn-gradient-accent w-100 py-3 mt-2 shadow" id="btnRegistro">
                        <i class="bi bi-person-plus-fill me-1"></i> Completar Registro
                    </button>
                </form>
            </div>

            <!-- MENSAJES DE ESTADO -->
            <div id="mensaje"></div>

            <!-- PANEL DE SESIÓN ACTIVA -->
            <div id="perfil">
                <div class="d-flex align-items-center gap-2 mb-2 text-success">
                    <i class="bi bi-patch-check-fill fs-4"></i>
                    <h5 class="fw-bold mb-0">Sesión Activa</h5>
                </div>
                <div id="datosPerfil" class="small mb-3 text-secondary"></div>
                <div class="d-flex flex-column gap-2">
                    <a href="../pages/docente.html" class="btn btn-primary rounded-pill py-2 fw-semibold">
                        <i class="bi bi-person-workspace me-1"></i> Ir al Portal Docente & Tareas
                    </a>
                    <a href="../pages/seguimiento.html" class="btn btn-info text-white rounded-pill py-2 fw-semibold">
                        <i class="bi bi-graph-up-arrow me-1"></i> Ir al Panel de Seguimiento
                    </a>
                    <button id="logout" class="btn btn-outline-danger rounded-pill py-2 fw-semibold mt-1">
                        <i class="bi bi-box-arrow-left me-1"></i> Cerrar Sesión
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script>
        const API = "/api";

        const tabLoginBtn = document.getElementById("tabLoginBtn");
        const tabRegistroBtn = document.getElementById("tabRegistroBtn");
        const seccionLogin = document.getElementById("seccionLogin");
        const seccionRegistro = document.getElementById("seccionRegistro");
        const tabsContenedor = document.getElementById("tabsContenedor");

        const loginForm = document.getElementById("loginForm");
        const registroForm = document.getElementById("registroForm");
        const mensaje = document.getElementById("mensaje");
        const perfil = document.getElementById("perfil");
        const datosPerfil = document.getElementById("datosPerfil");
        const logoutBtn = document.getElementById("logout");

        function cambiarTab(tipo) {
            mensaje.className = "";
            mensaje.style.display = "none";

            if (tipo === "login") {
                tabLoginBtn.classList.add("activo");
                tabRegistroBtn.classList.remove("activo");
                seccionLogin.classList.add("activo");
                seccionRegistro.classList.remove("activo");
            } else {
                tabRegistroBtn.classList.add("activo");
                tabLoginBtn.classList.remove("activo");
                seccionRegistro.classList.add("activo");
                seccionLogin.classList.remove("activo");
            }
        }

        function alternarMatricula(rol) {
            const grupoMatricula = document.getElementById("grupoMatricula");
            const inputMatricula = document.getElementById("matriculaRegistro");
            if (rol === "terapeuta") {
                grupoMatricula.style.display = "block";
                inputMatricula.required = true;
            } else {
                grupoMatricula.style.display = "none";
                inputMatricula.required = false;
                inputMatricula.value = "";
            }
        }

        function mostrarMensaje(texto, tipo) {
            mensaje.textContent = texto;
            mensaje.className = tipo === "exito" ? "msg-exito" : "msg-error";
            mensaje.style.display = "block";
        }

        registroForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("emailRegistro").value.trim();
            const password = document.getElementById("passwordRegistro").value;
            const rol = document.getElementById("rolRegistro").value;
            const matricula = document.getElementById("matriculaRegistro").value.trim();

            mostrarMensaje("Registrando usuario...", "exito");

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre, email, password, rol, matricula })
                });

                const data = await res.json();

                if (res.ok) {
                    mostrarMensaje(data.msg || "¡Registro exitoso! Ya puedes iniciar sesión.", "exito");
                    registroForm.reset();
                    setTimeout(() => cambiarTab("login"), 1200);
                } else {
                    mostrarMensaje(data.msg || "Error al registrarse.", "error");
                }
            } catch (err) {
                console.error("Error de red:", err);
                mostrarMensaje("No se pudo conectar con el servidor.", "error");
            }
        });

        loginForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("emailLogin").value.trim();
            const password = document.getElementById("passwordLogin").value;

            mostrarMensaje("Iniciando sesión...", "exito");

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    mostrarMensaje(data.msg || "¡Login exitoso!", "exito");

                    localStorage.setItem("token", data.token);
                    if (data.usuario) {
                        localStorage.setItem("usuario", JSON.stringify(data.usuario));
                    }

                    loginForm.reset();
                    verificarSesion();
                } else {
                    mostrarMensaje(data.msg || "Credenciales incorrectas.", "error");
                }
            } catch (err) {
                console.error("Error de red:", err);
                mostrarMensaje("No se pudo conectar con el servidor.", "error");
            }
        });

        async function verificarSesion() {
            const token = localStorage.getItem("token");
            if (!token) {
                perfil.style.display = "none";
                tabsContenedor.style.display = "flex";
                seccionLogin.style.display = "block";
                return;
            }

            try {
                const res = await fetch(`${API}/perfil`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const data = await res.json();

                if (res.ok && data.usuario) {
                    tabsContenedor.style.display = "none";
                    seccionLogin.style.display = "none";
                    seccionRegistro.style.display = "none";
                    perfil.style.display = "block";

                    const u = data.usuario;
                    datosPerfil.innerHTML = `
                        <strong>Nombre:</strong> ${u.nombre || 'Usuario'}<br>
                        <strong>Email:</strong> ${u.email}<br>
                        <strong>Rol:</strong> <span class="badge bg-primary text-capitalize">${u.rol || 'Familiar'}</span>
                    `;
                } else {
                    localStorage.removeItem("token");
                    localStorage.removeItem("usuario");
                    perfil.style.display = "none";
                    tabsContenedor.style.display = "flex";
                    seccionLogin.style.display = "block";
                }
            } catch (err) {
                console.error("Error verificando sesión:", err);
            }
        }

        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("usuario");
            perfil.style.display = "none";
            tabsContenedor.style.display = "flex";
            cambiarTab("login");
            mostrarMensaje("Has cerrado sesión.", "exito");
        });

        verificarSesion();
    </script>
</body>
</html>
